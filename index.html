<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ — KTW HUB</title>
    <!-- Prompt Font & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#1d2b44] text-slate-900 min-h-screen flex flex-col justify-between antialiased selection:bg-brand-100 selection:text-brand-600">
    <!-- โหลดแกนกลาง -->
    <script src="version.js"></script>
    <script src="shared/config.js"></script>
    <script src="shared/devBanner.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/perm.js"></script>

    <!-- Main Login Area -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-10">
        <div class="w-full max-w-md space-y-6">

            <!-- Login Card -->
            <div class="bg-white/95 backdrop-blur-md border border-white/40 shadow-2xl shadow-black/40 rounded-3xl p-8 space-y-6">
                <!-- Brand & Logo -->
                <div class="text-center space-y-2">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-500 shadow-lg shadow-orange-500/30 text-white font-black text-2xl mb-1">
                        KTW
                    </div>
                    <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight">KTW HUB</h2>
                    <p class="text-xs font-medium text-slate-500">ศูนย์รวมระบบบริการและจัดการสินค้าองค์กร</p>
                </div>

                <!-- Alert Message Box -->
                <div id="alert-box" class="hidden p-3.5 rounded-xl text-xs font-medium border flex items-center gap-2.5">
                    <i id="alert-icon" data-lucide="info" class="w-4 h-4 shrink-0"></i>
                    <span id="alert-text" class="flex-1"></span>
                </div>

                <!-- Form -->
                <form id="login-form" class="space-y-4" onsubmit="handleLoginSubmit(event)">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">รหัสพนักงาน (Employee ID)</label>
                        <div class="relative">
                            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                            <input type="text" id="emp_id" required autocomplete="username"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all"
                                placeholder="เช่น 2506">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">รหัสผ่าน (Password)</label>
                        <div class="relative">
                            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                            <input type="password" id="emp_pass" required autocomplete="current-password"
                                class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all"
                                placeholder="••••••••">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600">
                                <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit"
                        class="w-full mt-2 py-3 px-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center gap-2 group">
                        <span id="btn-text">เข้าสู่ระบบ</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>

                <div class="text-center pt-2 border-t border-slate-100">
                    <p class="text-[11px] text-slate-400">KTW Hub Portal • สภาพแวดล้อมทดสอบ (DEV)</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) window.lucide.createIcons();
            
            // ถ้าเคยล็อกอินไว้แล้ว ให้พาไปหน้าหลัก
            if (sessionStorage.getItem('emp_id')) {
                window.location.href = 'main.html';
            }
        });

        function togglePasswordVisibility() {
            const input = document.getElementById('emp_pass');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            if (window.lucide) window.lucide.createIcons();
        }

        function showAlert(msg, isError = true) {
            const box = document.getElementById('alert-box');
            const text = document.getElementById('alert-text');
            const icon = document.getElementById('alert-icon');
            box.className = isError 
                ? 'p-3.5 rounded-xl text-xs font-medium border border-red-200 bg-red-50 text-red-600 flex items-center gap-2.5'
                : 'p-3.5 rounded-xl text-xs font-medium border border-emerald-200 bg-emerald-50 text-emerald-600 flex items-center gap-2.5';
            text.textContent = msg;
            icon.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle-2');
            box.classList.remove('hidden');
            if (window.lucide) window.lucide.createIcons();
        }

        const ROLE_MODULES = [
            { sessionKey: 'disassembly_role', endpoint: 'get_disassembly_role', fallback: '0' },
            { sessionKey: 'ncr_role', endpoint: 'get_ncr_role', fallback: '0' },
            { sessionKey: 'claim_role', endpoint: 'get_role_claim_cus', fallback: '0' },
            { sessionKey: 'borrow_role', endpoint: 'borrow_my_perms', post: true, fallback: '0' }
        ];

        async function loadAllModuleRoles(empId) {
            await Promise.all(ROLE_MODULES.map(async (mod) => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3500);

                    const res = mod.post
                        ? await window.n8nFetch(mod.endpoint, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' }, 
                            body: JSON.stringify({ actorEmpId: empId }),
                            signal: controller.signal
                        })
                        : await window.n8nFetch(`${mod.endpoint}?empId=${encodeURIComponent(empId)}`, {
                            signal: controller.signal
                        });
                    
                    clearTimeout(timeoutId);

                    if (res.ok && mod.post) {
                        const txt = await res.text();
                        const j = txt && txt.trim() ? JSON.parse(txt) : {};
                        const o = Array.isArray(j) ? (j[0] || {}) : j;
                        const ps = Array.isArray(o.perms) ? o.perms : [];
                        sessionStorage.setItem(mod.sessionKey, ps.includes('MANAGE_ROLE') ? '1' : ps.includes('APPROVE') ? '2' : '0');
                    } else if (res.ok) {
                        const rawText = await res.text();
                        if (rawText && rawText.trim()) {
                            const raw = JSON.parse(rawText);
                            const data = Array.isArray(raw) ? (raw[0] || {}) : raw;
                            sessionStorage.setItem(mod.sessionKey, String(data.RoleId ?? data.role ?? mod.fallback));
                        } else {
                            sessionStorage.setItem(mod.sessionKey, mod.fallback);
                        }
                    } else {
                        sessionStorage.setItem(mod.sessionKey, mod.fallback);
                    }
                } catch (e) {
                    console.warn(`โหลดสิทธิ์ ${mod.sessionKey} ข้ามไปก่อน:`, e);
                    sessionStorage.setItem(mod.sessionKey, mod.fallback);
                }
            }));
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const empId = document.getElementById('emp_id').value.trim();
            const empPass = document.getElementById('emp_pass').value;
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');

            if (!empId || !empPass) {
                showAlert('กรุณากรอกรหัสพนักงานและรหัสผ่านให้ครบถ้วน');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'กำลังตรวจสอบ...';

            try {
                const res = await window.n8nFetch('Check_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: empId, password: empPass })
                });

                let data = await res.json();
                if (Array.isArray(data)) data = data[0] || null;

                if (res.ok && data && (data.success === true || (data.emp_id && data.emp_id.trim() !== ''))) {
                    // บันทึก Session พื้นฐาน
                    sessionStorage.setItem('emp_id', data.emp_id || empId);
                    sessionStorage.setItem('name', data.emp_name || empId);
                    sessionStorage.setItem('email', data.emp_email || '');
                    sessionStorage.setItem('dep', data.emp_dep || 'KTW');
                    sessionStorage.setItem('emp_type', String(data.emp_type ?? '0'));

                    showAlert('เข้าสู่ระบบสำเร็จ กำลังนำทาง...', false);

                    // ดึงสิทธิ์ระบบอื่นๆ แบบขนาน (ไม่รอค้าง)
                    loadAllModuleRoles(data.emp_id || empId);
                    if (window.KTWPerm) window.KTWPerm.load();

                    setTimeout(() => {
                        window.location.href = 'main.html';
                    }, 400);
                } else {
                    showAlert(data.message || 'รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง');
                    btn.disabled = false;
                    btnText.textContent = 'เข้าสู่ระบบ';
                }
            } catch (err) {
                console.error('Login error:', err);
                showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
                btn.disabled = false;
                btnText.textContent = 'เข้าสู่ระบบ';
            }
        }
    </script>
</body>
</html>
